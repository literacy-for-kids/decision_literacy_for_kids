<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pmTitle">
  <title id="pmTitle">Payoff matrix for the sharing game: if both cooperate, both get 3 points; if one defects while the other cooperates, the defector gets 5 and the cooperator gets 0; if both defect, both get only 1</title>
  <rect x="1" y="1" width="858" height="498" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Sharing Game: Payoff Matrix</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Numbers = points each player wins. Your number is first.</text>

  <!-- headers -->
  <text x="470" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569">PARTNER</text>
  <text x="345" y="142" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b">cooperates</text>
  <text x="655" y="142" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b">defects</text>
  <text x="82" y="300" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569" transform="rotate(-90 82 300)">YOU</text>
  <text x="120" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" transform="rotate(-90 120 230)">cooperate</text>
  <text x="120" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" transform="rotate(-90 120 390)">defect</text>

  <!-- cells -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <g>
      <rect x="190" y="155" width="310" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
      <text x="345" y="215" font-size="26" font-weight="800" fill="#166534">3 &#183; 3</text>
      <text x="345" y="248" font-size="13.5" fill="#1e293b">both cooperate &#8594; both do well</text>
      <text x="345" y="270" font-size="12.5" fill="#64748b">best deal for the team</text>
    </g>
    <g>
      <rect x="510" y="155" width="290" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
      <text x="655" y="215" font-size="26" font-weight="800" fill="#c2410c">0 &#183; 5</text>
      <text x="655" y="248" font-size="13.5" fill="#1e293b">you cooperate, partner defects</text>
      <text x="655" y="270" font-size="12.5" fill="#64748b">partner wins big &#8212; you get nothing</text>
    </g>
    <g>
      <rect x="190" y="315" width="310" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
      <text x="345" y="375" font-size="26" font-weight="800" fill="#c2410c">5 &#183; 0</text>
      <text x="345" y="408" font-size="13.5" fill="#1e293b">you defect, partner cooperates</text>
      <text x="345" y="430" font-size="12.5" fill="#64748b">you win big &#8212; partner gets nothing</text>
    </g>
    <g>
      <rect x="510" y="315" width="290" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
      <text x="655" y="375" font-size="26" font-weight="800" fill="#991b1b">1 &#183; 1</text>
      <text x="655" y="408" font-size="13.5" fill="#1e293b">both defect &#8594; both do badly</text>
      <text x="655" y="430" font-size="12.5" fill="#64748b">nobody trusts anybody</text>
    </g>
  </g>

  <text x="430" y="486" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">The puzzle: defecting looks safer for each player alone &#8212; but if both think that way, everyone loses.</text>
</svg>
