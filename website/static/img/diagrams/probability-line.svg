<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plTitle">
  <title id="plTitle">A probability line from zero (impossible) to one (certain), with everyday events placed along it: the sun rising is near certain, a coin flip is one-half, rolling a six is about one in six, and a pet dinosaur is impossible</title>
  <rect x="1" y="1" width="858" height="338" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Probability Line</text>
  <text x="430" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Every &#8220;maybe&#8221; lives somewhere between impossible and certain.</text>

  <!-- line -->
  <line x1="90" y1="190" x2="770" y2="190" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <g fill="#ea580c">
    <circle cx="90" cy="190" r="11"/>
    <circle cx="260" cy="190" r="9"/>
    <circle cx="430" cy="190" r="9"/>
    <circle cx="600" cy="190" r="9"/>
    <circle cx="770" cy="190" r="11"/>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <text x="90" y="232" font-size="17" font-weight="800" fill="#ea580c">0</text>
    <text x="90" y="254" font-size="13" fill="#64748b">impossible</text>
    <text x="260" y="232" font-size="15" font-weight="700" fill="#c2410c">&#188;</text>
    <text x="430" y="232" font-size="15" font-weight="700" fill="#c2410c">&#189;</text>
    <text x="600" y="232" font-size="15" font-weight="700" fill="#c2410c">&#190;</text>
    <text x="770" y="232" font-size="17" font-weight="800" fill="#ea580c">1</text>
    <text x="770" y="254" font-size="13" fill="#64748b">certain</text>

    <!-- events above -->
    <text x="90" y="140" font-size="13" fill="#1e293b">a pet dinosaur</text>
    <text x="90" y="158" font-size="13" fill="#1e293b">shows up &#129430;</text>
    <text x="203" y="118" font-size="13" fill="#1e293b">rolling a 6</text>
    <text x="203" y="136" font-size="13" fill="#1e293b">on one try &#127922; (&#8776;&#8537;)</text>
    <text x="430" y="152" font-size="13" fill="#1e293b">coin lands heads &#129689;</text>
    <text x="640" y="118" font-size="13" fill="#1e293b">it rains sometime</text>
    <text x="640" y="136" font-size="13" fill="#1e293b">this month &#127783;&#65039;</text>
    <text x="770" y="152" font-size="13" fill="#1e293b">the sun rises &#127774;</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="203" y1="145" x2="203" y2="180"/>
    <line x1="640" y1="145" x2="628" y2="180"/>
    <line x1="90" y1="166" x2="90" y2="177"/>
    <line x1="430" y1="160" x2="430" y2="179"/>
    <line x1="770" y1="160" x2="770" y2="177"/>
  </g>
  <circle cx="203" cy="190" r="7" fill="#fdba74"/>

  <text x="430" y="315" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">Even a &#8220;likely&#8221; thing is not guaranteed on any single try.</text>
</svg>
