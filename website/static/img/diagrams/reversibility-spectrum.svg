<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rsTitle">
  <title id="rsTitle">The reversibility spectrum: a line from easily undo to can't undo, with example decisions placed along it</title>
  <defs>
    <marker id="rsA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="298" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">The Reversibility Spectrum</text>

  <!-- axis -->
  <line x1="90" y1="170" x2="670" y2="170" stroke="#ea580c" stroke-width="3.5" marker-start="url(#rsA)" marker-end="url(#rsA)"/>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text x="95" y="205" font-size="15" font-weight="700" fill="#16a34a">Easily Undo</text>
    <text x="95" y="224" font-size="12.5" fill="#64748b">two-way door: walk back through</text>
    <text x="665" y="205" text-anchor="end" font-size="15" font-weight="700" fill="#b91c1c">Can't Undo</text>
    <text x="665" y="224" text-anchor="end" font-size="12.5" fill="#64748b">one-way door: it locks behind you</text>
  </g>

  <!-- example markers -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" text-anchor="middle">
    <g>
      <circle cx="130" cy="170" r="7" fill="#16a34a"/>
      <line x1="130" y1="163" x2="130" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="108" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">what to eat</text>
      <text x="130" y="94" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" font-weight="700">Breakfast</text>
    </g>
    <g>
      <circle cx="330" cy="170" r="7" fill="#ca8a04"/>
      <line x1="330" y1="163" x2="330" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="330" y="108" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">can quit, but time is spent</text>
      <text x="330" y="94" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" font-weight="700">After-school activity</text>
    </g>
    <g>
      <circle cx="470" cy="170" r="7" fill="#f97316"/>
      <line x1="470" y1="163" x2="470" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="470" y="268" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" font-weight="700">Birthday money spent</text>
      <text x="470" y="283" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">gone, but a contained amount</text>
    </g>
    <g>
      <circle cx="610" cy="170" r="7" fill="#b91c1c"/>
      <line x1="610" y1="163" x2="610" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="610" y="108" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">very hard to fully delete</text>
      <text x="610" y="94" fill="#1e293b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" font-weight="700">Posting online</text>
    </g>
  </g>
</svg>
