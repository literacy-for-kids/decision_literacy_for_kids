<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="poTitle">
  <title id="poTitle">The two-by-two grid of decision process versus outcome: good process with good outcome is deserved success, good process with bad outcome is bad luck, bad process with good outcome is dumb luck, and bad process with bad outcome is deserved failure</title>
  <rect x="1" y="1" width="858" height="558" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Process vs. Outcome: The 2&#215;2 Grid</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Judge the <tspan font-weight="700">decision</tspan>, not just the <tspan font-weight="700">result</tspan>.</text>

  <!-- axis labels -->
  <text x="470" y="102" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569">THE OUTCOME</text>
  <text x="330" y="127" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">turned out well</text>
  <text x="650" y="127" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">turned out badly</text>
  <text x="70" y="300" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569" transform="rotate(-90 70 300)">THE PROCESS</text>
  <text x="105" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b" transform="rotate(-90 105 230)">good thinking</text>
  <text x="105" y="440" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b" transform="rotate(-90 105 440)">sloppy thinking</text>

  <!-- quadrants -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <g>
      <rect x="175" y="140" width="310" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
      <text x="330" y="205" font-size="18" font-weight="800" fill="#166534">DESERVED SUCCESS</text>
      <text x="330" y="235" font-size="13.5" fill="#1e293b">You thought it through</text>
      <text x="330" y="254" font-size="13.5" fill="#1e293b">and it worked. Nice!</text>
      <text x="330" y="290" font-size="12.5" fill="#64748b" font-style="italic">wore a helmet, rode safely, arrived happy</text>
    </g>
    <g>
      <rect x="495" y="140" width="310" height="180" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
      <text x="650" y="205" font-size="18" font-weight="800" fill="#a16207">BAD LUCK</text>
      <text x="650" y="235" font-size="13.5" fill="#1e293b">You made the right call &#8212;</text>
      <text x="650" y="254" font-size="13.5" fill="#1e293b">the result still stung.</text>
      <text x="650" y="290" font-size="12.5" fill="#64748b" font-style="italic">studied hard, but the quiz asked the one odd question</text>
    </g>
    <g>
      <rect x="175" y="330" width="310" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
      <text x="330" y="395" font-size="18" font-weight="800" fill="#c2410c">DUMB LUCK</text>
      <text x="330" y="425" font-size="13.5" fill="#1e293b">It worked out&#8230; but the</text>
      <text x="330" y="444" font-size="13.5" fill="#1e293b">thinking was sloppy. Careful!</text>
      <text x="330" y="480" font-size="12.5" fill="#64748b" font-style="italic">didn&#8217;t study, guessed, happened to pass</text>
    </g>
    <g>
      <rect x="495" y="330" width="310" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
      <text x="650" y="395" font-size="18" font-weight="800" fill="#991b1b">DESERVED FAILURE</text>
      <text x="650" y="425" font-size="13.5" fill="#1e293b">Sloppy thinking, bad result.</text>
      <text x="650" y="444" font-size="13.5" fill="#1e293b">The most useful box to study.</text>
      <text x="650" y="480" font-size="12.5" fill="#64748b" font-style="italic">skipped the helmet, scraped a knee</text>
    </g>
  </g>

  <text x="430" y="540" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">A good decision can have a bad outcome &#8212; and you can still say: &#8220;I made the right call.&#8221;</text>
</svg>
